spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:app_db}
    username: ${DB_USER:app_user}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true

logging:
  level:
    root: INFO
    cl.cesarquezada.proyecto: DEBUG

jwt:
  secret: ${JWT_SECRET:local-dev-secret-no-usar-en-produccion-cambiar-siempre}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
